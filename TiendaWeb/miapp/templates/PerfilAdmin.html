{% extends 'base.html' %}
{% load static %}

{% block content %}

        <!-- Perfil de Administrador -->
        <div class="container mt-5">
            <div class="card shadow-lg p-4">
                <div class="row">
                    <!-- Foto de Perfil -->
                    <div class="col-md-3 text-center">
                        <img src="{% static 'core/Imagenes/iconos/imgperfil.png' %}" alt="Foto de perfil" class="rounded-circle img-fluid">
                        <h4 class="mt-3">{{ usuario.nombre }}</h4>
                    </div>
            
                    <!-- Información del Administrador -->
                    <div class="col-md-9">
                        <h3>Perfil de Administrador</h3>
                        <p><strong>Correo:</strong> {{ usuario.correo }}</p>
                
                        <!-- Botón para modo Administrador -->
                        <button class="btn btn-secondary" data-bs-toggle="collapse" href="#modoAdmin" role="button" aria-expanded="false" aria-controls="editProfile">
                            Modo Administrador
                        </button>
                        <form method="POST" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">Cerrar Sesión</button>
                        </form>

                        <!-- Modo Admin -->
                        <div class="collapse mt-3" id="modoAdmin">

                            <div class="collapse mt-3" id="modoAdmin">
                                <h4 class="mb-3">Panel de Administración</h4>
                            
                                <div class="d-grid gap-2 col-md-6">
                                    <!-- Enlace a gestión de usuarios -->
                                    <a href="{% url 'listar_usuarios' %}" class="btn btn-outline-secondary">
                                        Gestionar Usuarios
                                    </a>
                            
                                    <!-- Enlace a gestión de productos -->
                                    <a href="{% url 'listar_productos' %}" class="btn btn-outline-secondary">
                                        Gestionar Videojuegos
                                    </a>

                                    <!-- Enlace a gestión de productos -->
                                    <a href="{% url 'productos_api_lista' %}" class="btn btn-outline-secondary">
                                        Lista de Productos
                                    </a>
                                </div>
                            </div>

                        </div>                        
                    </div>
                </div>
            </div>
        </div>

{% endblock %}
