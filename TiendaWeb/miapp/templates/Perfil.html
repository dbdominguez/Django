{% extends 'base.html' %}
{% load static %}

{% block content %}

        <!-- Perfil de Usuario -->
        <div class="container mt-5">
            <div class="card shadow-lg p-4">
                <div class="row">
                    <!-- Foto de Perfil -->
                    <div class="col-md-3 text-center">
                        <img src="{% static 'core/Imagenes/iconos/imgperfil.png' %}" alt="Foto de perfil" class="rounded-circle img-fluid">
                        <h4 class="mt-3">{{ usuario.nombre }}</h4>
                    </div>
            
                    <!-- Información del Usuario -->
                    <div class="col-md-9">
                        <h3>Perfil de Usuario</h3>
                        <p><strong>Correo:</strong> {{ usuario.correo }}</p>
                
                        <!-- Botón para Editar Perfil -->
                        <button class="btn btn-secondary" data-bs-toggle="collapse" href="#editProfile" role="button" aria-expanded="false" aria-controls="editProfile">
                            Editar Perfil
                        </button>
                        <form method="POST" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">Cerrar Sesión</button>
                        </form>

                        <!-- Formulario de Edición de Perfil -->
                        <div class="collapse mt-3" id="editProfile">
                            <h4>Editar Perfil</h4>
                            <form method="POST">
                                {% csrf_token %}
                                {{ form.as_p }}
                                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                            </form>
                        </div>                    
                               
                        <!-- Secciones -->
                        <ul class="nav nav-tabs mt-4" id="perfilTabs">
                            <li class="nav-item">
                                <a class="nav-link active" id="historial-tab" data-bs-toggle="tab" href="#historial">Historial de Compra</a>
                            </li>
                        </ul>

                        <div class="tab-content mt-3">
                            <div class="tab-pane fade show active" id="historial">
                                <p>Lista de compras realizadas.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

{% endblock %}
