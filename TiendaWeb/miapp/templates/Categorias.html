{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- Banner Categoria -->
<div class="separador container-fluid d-flex flex-column align-items-center p-3" style="background: rgb(245, 180, 180); border-radius: 50px;">
    <h1>{{ categoria.nombre }}</h1> <!-- Muestra el nombre de la categoría -->
</div>

<hr class="lineaA">

<!-- Lista Juegos -->
<div class="container my-4">
    {% for juego in juegos %}
    <div class="row align-items-center mb-3">
        <div class="col-md-3 text-center">
            <img src="{{ juego.imagen_url }}" alt="{{ juego.nombre }}" class="img-fluid rounded">
        </div>
        <div class="col-md-6">
            <h2>
                <a href="{% url 'detalle_producto' juego.id_producto %}">{{ juego.nombre }}</a>
            </h2>
            <p>{{ juego.descripcion }}</p>
        </div>
        <div class="col-md-3 text-center">
            <span class="precio d-block">${{ juego.precio }}</span>
            <a href="{% url 'agregar_al_carro' juego.id_producto %}" class="btn btn-primary btn-sm mt-2">Agregar al carrito</a>
        </div>
    </div>
    <hr class="lineaB">
    {% endfor %}
</div>

{% endblock %}
